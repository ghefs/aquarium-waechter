name: 💡 Funktion wünschen
description: Idee für eine neue Funktion oder Verbesserung.
labels: [wunsch]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
      description: z. B. „Ich merke nicht, wenn …“
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Wie stellst du dir die Lösung vor?
  - type: input
    id: firmware
    attributes:
      label: ProfiLux-Modell und Firmware
      description: Hilft einzuschätzen, was die GHL-API bei dir hergibt.
  - type: markdown
    attributes:
      value: |
        Hinweis: Der Wächter **liest nur** – Schalten oder Werte am ProfiLux ändern ist bewusst nicht vorgesehen.
