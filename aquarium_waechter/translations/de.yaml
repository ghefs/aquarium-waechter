configuration:
  geraete:
    name: ProfiLux-Geräte
    description: >-
      Pro ProfiLux: name und host (IP). Alles Weitere bequemer in HA auf der
      Einstellungsseite des Dashboards. Optional als Vorgabe: steckdosenleisten
      (Dosen je Leiste, z. B. „STDL=4 (ohne Strom), PAB=6“ – einfacher: in HA die Leisten auswählen).
      Bereiche (steckdosen, sensoren, niveau, durchfluss, dosierer, kh_director, licht)
      lassen sich bequemer in HA auf der Einstellungsseite an-/ausschalten.
      unbenannte_abfragen: auch Teile ohne Namen auslesen.
  telegram_chat_id:
    name: Telegram-Chat-ID
    description: Wohin die Alarme gehen – Gruppe (beginnt mit -) oder Einzelchat (positive Zahl), mehrere mit Komma. Wie man die ID findet, steht in der Anleitung unter „Telegram“. Leer = kein Telegram.
  app_push:
    name: Push an die Home-Assistant-App
    description: >-
      Nicht nötig – bequemer in HA auf der Einstellungsseite unter „Alarm aufs Handy“ je
      Handy einschalten. Hier nur als Vorgabe: z. B. mobile_app_iphone_von_max, mehrere
      mit Komma. Störungen kommen als kritische Benachrichtigung (klingelt auch bei
      Stumm/Nicht stören).
  telegram_token:
    name: Telegram-Bot-Token
    description: Leer lassen, wenn die Telegram-Integration in HA eingerichtet ist – dann wird deren Token benutzt.
  intervall:
    name: Abfrageintervall (Sekunden)
  erinnerung:
    name: Erinnerung bei anhaltender Störung (Sekunden, 0 = aus)
  nicht_erreichbar_nach:
    name: Alarm „nicht erreichbar“ nach (Sekunden)
  rescan:
    name: Inventar neu einlesen alle (Sekunden)
  dashboard:
    name: Dashboard automatisch erzeugen
    description: Eigenes Dashboard „Aquarium“. Handänderungen werden erkannt und nicht überschrieben.
  start_meldung:
    name: Telegram-Meldung beim Start
  mqtt_host:
    name: Externer MQTT-Broker (Host)
    description: Nur ausfüllen, wenn NICHT das Mosquitto-Add-on benutzt wird.
  mqtt_port:
    name: Externer MQTT-Broker (Port)
  mqtt_user:
    name: Externer MQTT-Broker (Benutzer)
  mqtt_password:
    name: Externer MQTT-Broker (Passwort)
  debug:
    name: Ausführliches Log
