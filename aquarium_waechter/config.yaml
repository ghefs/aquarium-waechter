name: Aquarium-Wächter
version: "4.0.2"
slug: aquarium_waechter
description: Überwacht GHL ProfiLux 4 Aquariencomputer – Werte in Home Assistant, Alarme per Telegram
url: https://github.com/ghefs/aquarium-waechter
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
services: [mqtt:need]
homeassistant_api: true
map:
  - addon_config:rw
  - homeassistant_config:ro
options:
  geraete:
    - name: ProfiLux
      host: 192.168.1.50
  telegram_chat_id: ""
  intervall: 60
  dashboard: true
schema:
  geraete:
    - name: str
      host: str
      port: port?
      id: match(^[a-z0-9_]+$)?
      steckdosen: bool?
      sensoren: bool?
      niveau: bool?
      durchfluss: bool?
      dosierer: bool?
      kh_director: bool?
      unbenannte_abfragen: bool?
  telegram_chat_id: str?
  telegram_token: password?
  intervall: int(20,3600)
  erinnerung: int(0,86400)?
  nicht_erreichbar_nach: int(60,86400)?
  rescan: int(300,86400)?
  dashboard: bool
  start_meldung: bool?
  debug: bool?
